# 🚀 Autostart adicional (executado depois dos atalhos)

# Teclado ABNT2
exec --no-startup-id setxkbmap br

# Monitores primeiro, depois wallpaper (o script do monitor já recarrega o fundo)
exec_always --no-startup-id ~/.config/i3/scripts/monitor.sh

# Barra
exec_always --no-startup-id ~/.config/polybar/launch.sh

# Scratchpads
exec --no-startup-id kitty --class "scratch-terminal"
exec --no-startup-id spotify

# Tela nunca apaga nem bloqueia sozinha (escolha do dono: monitores sempre ligados)
exec_always --no-startup-id xset s off s noblank -dpms
