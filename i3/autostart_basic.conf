# 🚀 Autostart básico (executado cedo)

# Apps de autostart do XDG
exec --no-startup-id dex --autostart --environment i3

# Applet de rede
exec --no-startup-id nm-applet

# Notificações (o dbus também sobe o dunst sozinho; aqui garante o tema certo)
exec --no-startup-id dunst

# Bloqueio antes de suspender — desativado de propósito (decisão do dono).
# Para ativar: descomente. Usa o mesmo script do Mod+Shift+x.
#exec --no-startup-id xss-lock --transfer-sleep-lock -- ~/.config/i3/scripts/lock.sh --nofork

# Renomeia workspaces com ícones dos apps, se o sworkstyle estiver instalado
exec_always --no-startup-id sh -c 'bin="$HOME/.cargo/bin/sworkstyle"; [ -x "$bin" ] || exit 0; pgrep -x sworkstyle >/dev/null || exec "$bin"'
