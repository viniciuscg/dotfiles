# 🔤 Fonte (títulos de janela e barra de modo)
font pango:JetBrainsMono Nerd Font 10

# 🪟 Bordas: 2px sem barra de título; floating com 2px também.
default_border pixel 2
default_floating_border pixel 2
hide_edge_borders smart

# 📐 Gaps discretos (i3 >= 4.22). smart_gaps tira o espaço com uma janela só.
gaps inner 8
gaps outer 0
smart_gaps on
