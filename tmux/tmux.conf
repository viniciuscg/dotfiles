# tmux — paleta "Dirt" (ver theme/palette.sh)
# Prefixo: Ctrl+a. Recarregar: prefixo + r.

# ⚙️ Base
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-kitty:RGB"
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g set-titles on
set -g set-titles-string "#S · #W"
setw -g automatic-rename on
set -g display-time 1500

# ⌨️ Prefixo
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf recarregado"

# Splits e janelas novas no diretório atual
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Navegação estilo vim (h j k l) e redimensionar com H J K L
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# Alt+1..9 troca de janela sem prefixo
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Modo cópia com teclas do vi
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# 🎨 Visual
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=#110e0b,fg=#a89984"

set -g status-left-length 30
set -g status-left "#[fg=#110e0b,bg=#b8652f,bold] #S #[bg=#110e0b] "
set -g status-right-length 60
set -g status-right "#{?client_prefix,#[fg=#b8652f]● ,}#[fg=#7c6f64]#h  #[fg=#a89984]%H:%M "

setw -g window-status-format "#[fg=#7c6f64] #I #W "
setw -g window-status-current-format "#[fg=#e6d5b3,bg=#2f2722,bold] #I #W #{?window_zoomed_flag,󰊓 ,}"
setw -g window-status-activity-style "fg=#c9a35a"
setw -g window-status-bell-style "fg=#a85050"
setw -g window-status-separator ""
setw -g monitor-activity on
set -g visual-activity off

set -g pane-border-style "fg=#2f2722"
set -g pane-active-border-style "fg=#b8652f"
set -g pane-border-lines single
set -g display-panes-colour "#7c6f64"
set -g display-panes-active-colour "#b8652f"

set -g message-style "bg=#241e19,fg=#d4be98"
set -g message-command-style "bg=#241e19,fg=#d4be98"
setw -g mode-style "bg=#3b322b,fg=#e6d5b3"
setw -g clock-mode-colour "#b8652f"

# 🔌 Ajustes locais (fora do repo), se existirem
if-shell "test -f ~/.config/tmux/local.conf" "source-file ~/.config/tmux/local.conf"
