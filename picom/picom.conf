# picom — compositor discreto: vsync sem tearing, cantos só em janelas
# flutuantes e quase nenhuma transparência. Sem blur.

backend = "glx";
vsync = true;
use-damage = true;

# 🔲 Cantos (mesmo raio do rofi/dunst)
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "!I3_FLOATING_WINDOW@"
];

# 🌫️ Sombra leve só nas flutuantes
shadow = true;
shadow-radius = 14;
shadow-offset-x = -10;
shadow-offset-y = -8;
shadow-opacity = 0.45;
shadow-color = "#000000";
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@",
  "!I3_FLOATING_WINDOW@"
];

# 🎞️ Fade curto
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 6;

# 👁️ Opacidade: janelas inativas levemente apagadas; nada fica translúcido
# a ponto de atrapalhar a leitura.
active-opacity = 1.0;
inactive-opacity = 1.0;
inactive-dim = 0.06;
opacity-rule = [
  "96:class_g = 'scratch-terminal'"
];

detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
