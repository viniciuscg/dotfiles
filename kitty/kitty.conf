# Kitty — paleta "Dirt" (ver theme/palette.sh) · JetBrains Mono

# 🔤 Fonte
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
disable_ligatures cursor

# ▌ Cursor e mouse
cursor_shape          beam
cursor_blink_interval 0
mouse_hide_wait       2.0
copy_on_select        clipboard
strip_trailing_spaces smart

# 🖥️ Desempenho
repaint_delay   10
input_delay     2
sync_to_monitor yes

# 🪟 Janela
remember_window_size   no
initial_window_width   110c
initial_window_height  32c
window_padding_width   10 14
hide_window_decorations yes
placement_strategy     center
window_border_width    1pt
draw_minimal_borders   yes
inactive_text_alpha    0.85

# Opacidade quase total e sem blur: legibilidade primeiro.
# ctrl+shift+a>m / l ajustam na hora se precisar.
background_opacity         1.0
dynamic_background_opacity yes

# 🗂️ Abas
tab_bar_edge          bottom
tab_bar_style         separator
tab_separator         "  "
tab_bar_min_tabs      2
tab_bar_margin_height 4 0
tab_title_template    " {index}·{title} "
active_tab_font_style   bold
inactive_tab_font_style normal

# 🎨 Cores
foreground           #d4be98
background           #1a1613
selection_foreground #e6d5b3
selection_background #3b322b
cursor               #d4be98
cursor_text_color    #1a1613
url_color            #b8652f
url_style            straight

# preto
color0  #241e19
color8  #7c6f64
# vermelho (bordô)
color1  #8e3b3b
color9  #a85050
# verde (oliva)
color2  #7f8448
color10 #9a9c62
# amarelo (ocre)
color3  #b08a3e
color11 #c9a35a
# azul (aço)
color4  #6f8584
color12 #8a9e9b
# magenta (malva)
color5  #8a6c75
color13 #a5858f
# ciano (sálvia)
color6  #6e8a6f
color14 #88a389
# branco
color7  #a89984
color15 #e6d5b3

active_tab_foreground   #d4be98
active_tab_background   #2f2722
inactive_tab_foreground #7c6f64
inactive_tab_background #1a1613
tab_bar_background      #110e0b

active_border_color   #b8652f
inactive_border_color #3b322b
bell_border_color     #a85050
mark1_background      #b8652f
mark2_background      #7f8448
mark3_background      #8e3b3b

# ⌨️ Atalhos
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+s paste_from_selection

map ctrl+shift+equal     change_font_size all +1.0
map ctrl+shift+plus      change_font_size all +1.0
map ctrl+shift+minus     change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+] next_tab
map ctrl+shift+[ previous_tab

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+q     close_window
map ctrl+shift+l     next_layout
enabled_layouts tall:bias=50;full_size=1,splits,stack,grid

map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05
map ctrl+shift+a>d set_background_opacity default

map ctrl+shift+h show_scrollback
map ctrl+shift+f5 load_config_file

# 📜 Rolagem
scrollback_lines 20000
scrollback_pager_history_size 64

# 🔔 Avisos
enable_audio_bell    no
visual_bell_duration 0
window_alert_on_bell yes

# ⚙️ Integração
shell_integration   enabled
allow_remote_control yes
clipboard_control   write-clipboard write-primary read-clipboard-ask read-primary-ask
term                xterm-256color
update_check_interval 0
detect_urls         yes
shell /usr/bin/zsh
