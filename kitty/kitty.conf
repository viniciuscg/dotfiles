# Kitty — paleta "Yuta" (ver theme/palette.sh) · JetBrains Mono

# 🔤 Fonte
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
disable_ligatures cursor

# ▌ Cursor e mouse
cursor_shape          beam
cursor_blink_interval 0
mouse_hide_wait       2.0
copy_on_select        clipboard
strip_trailing_spaces smart

# 🖥️ Desempenho
repaint_delay   10
input_delay     2
sync_to_monitor yes

# 🪟 Janela
remember_window_size   no
initial_window_width   110c
initial_window_height  32c
window_padding_width   10 14
hide_window_decorations yes
placement_strategy     center
window_border_width    1pt
draw_minimal_borders   yes
inactive_text_alpha    0.85

# Opacidade quase total e sem blur: legibilidade primeiro.
# ctrl+shift+a>m / l ajustam na hora se precisar.
background_opacity         1.0
dynamic_background_opacity yes

# 🗂️ Abas
tab_bar_edge          bottom
tab_bar_style         separator
tab_separator         "  "
tab_bar_min_tabs      2
tab_bar_margin_height 4 0
tab_title_template    " {index}·{title} "
active_tab_font_style   bold
inactive_tab_font_style normal

# 🎨 Cores
foreground           #d3dade
background           #0e1419
selection_foreground #f5f6f6
selection_background #2c3a44
cursor               #d3dade
cursor_text_color    #0e1419
url_color            #7fb3c1
url_style            straight

# preto
color0  #151d24
color8  #6a8290
# vermelho (bordô)
color1  #b35866
color9  #cf6b78
# verde (oliva)
color2  #6f9a7d
color10 #8fbc9a
# amarelo (ocre)
color3  #a8966a
color11 #d0bc8a
# azul (aço)
color4  #648aa0
color12 #86aac0
# magenta (malva)
color5  #7476c4
color13 #9a9fe6
# ciano (sálvia)
color6  #5b95a3
color14 #8cc4d0
# branco
color7  #94a6ab
color15 #f5f6f6

active_tab_foreground   #d3dade
active_tab_background   #1e2a32
inactive_tab_foreground #6a8290
inactive_tab_background #0e1419
tab_bar_background      #090d11

active_border_color   #7fb3c1
inactive_border_color #2c3a44
bell_border_color     #cf6b78
mark1_background      #7fb3c1
mark2_background      #6f9a7d
mark3_background      #b35866

# ⌨️ Atalhos
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+s paste_from_selection

map ctrl+shift+equal     change_font_size all +1.0
map ctrl+shift+plus      change_font_size all +1.0
map ctrl+shift+minus     change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+] next_tab
map ctrl+shift+[ previous_tab

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+q     close_window
map ctrl+shift+l     next_layout
enabled_layouts tall:bias=50;full_size=1,splits,stack,grid

map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05
map ctrl+shift+a>d set_background_opacity default

map ctrl+shift+h show_scrollback
map ctrl+shift+f5 load_config_file

# 📜 Rolagem
scrollback_lines 20000
scrollback_pager_history_size 64

# 🔔 Avisos
enable_audio_bell    no
visual_bell_duration 0
window_alert_on_bell yes

# ⚙️ Integração
shell_integration   enabled
allow_remote_control yes
clipboard_control   write-clipboard write-primary read-clipboard-ask read-primary-ask
term                xterm-256color
update_check_interval 0
detect_urls         yes
shell /usr/bin/zsh
